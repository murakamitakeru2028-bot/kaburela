name: Update static data

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - backend/config.py
  schedule:
    # 02:00 JST every Sunday.
    - cron: "0 17 * * 6"

permissions:
  contents: write

jobs:
  update-static-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh stock universe (JPX listed stocks)
        run: python backend/stock_universe.py

      - name: Export static data
        run: python backend/export_static.py --refresh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data backend/data
          if git diff --cached --quiet; then
            echo "No static data changes."
          else
            git commit -m "Update static market data"
            git push
          fi
